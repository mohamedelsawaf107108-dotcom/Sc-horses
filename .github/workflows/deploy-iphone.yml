name: Publish SC Horses iPhone

on:
  push:
    branches: [main]
    paths:
      - 'SC-Horses-iPhone.zip'
      - '.github/workflows/deploy-iphone.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sc-horses-iphone-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract iPhone project
        run: unzip -q SC-Horses-iPhone.zip -d iphone-source

      - name: Prepare and check app
        working-directory: iphone-source/SC-Horses-iPhone
        run: |
          python3 build_offline.py
          node tests/check-web.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: iphone-source/SC-Horses-iPhone/web

      - name: Publish app
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show installation link
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Open in Safari — $APP_URL" >> "$GITHUB_STEP_SUMMARY"
