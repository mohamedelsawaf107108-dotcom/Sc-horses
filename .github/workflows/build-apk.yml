name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q SC-Horses-Android.zip -d android-source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p android-source/SC-Horses-Android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Horses-APK
          path: android-source/SC-Horses-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
